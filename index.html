<header><h1><span class=brand><img id=hl class=hlogo alt=""><span>ToolUp</span></span><span class=hb><button class=ib id=cal onclick="setCal()" aria-label="Switch calendar" style="width:auto;padding:0 8px;font-weight:700"></button><button class=ib id=gear onclick="go('hub')" aria-label="Settings"></button></span></h1><div id=pf></div></header><main id=m><div class=sk></div><div class=sk></div><div class=sk></div></main><nav id=nav></nav><div id=sh onclick="if(event.target==this)closeS()"><div id=shb></div></div><div id=sh2 onclick="if(event.target==this)closeS2()"><div id=sh2b></div></div><div id=lock></div><div id=cover></div><div id=toast></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
//CORE
const SEED={};
const lt=r=>r.total!=null?+r.total:(r.qty!=null&&r.price!=null?r.qty*r.price:0);
const need=r=>r.open?(!r.item||r.qty==null):!r.date||r.qty==null||r.price==null||!r.item;
const med=a=>{a=[...a].sort((x,y)=>x-y);const n=a.length;return n%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2};
const EA=Date.UTC(2018,8,11)/864e5,yl=y=>y%4==3?366:365,EM=['Meskerem','Tikimt','Hidar','Tahsas','Tir','Yekatit','Megabit','Miazia','Ginbot','Sene','Hamle','Nehase','Pagume'],GM=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function g2e(iso){let n=Math.round(Date.parse(iso)/864e5)-EA,y=2011;while(n<0){y--;n+=yl(y)}while(n>=yl(y)){n-=yl(y);y++}return[y,Math.floor(n/30)+1,n%30+1]}
function e2g(y,m,d){let n=(m-1)*30+d-1,k=2011;while(k<y)n+=yl(k++);while(k>y)n-=yl(--k);return new Date((EA+n)*864e5).toISOString().slice(0,10)}
function calc(s,b){b=b||s;const B={},bi=c=>B[c]||(B[c]={q:0,c:0,t:0,sq:0,uq:0});let bun=0;
b.P.forEach(r=>{if(r.open)return;if(r.item){const x=bi(r.item);x.q+=r.qty||0;x.c+=lt(r);x.t+=tL(b,r)}else bun+=lt(r)+tL(b,r)});let op=0;b.P.forEach(r=>{if(!r.open||!r.item)return;const x=bi(r.item),v=r.price!=null?(r.total!=null?+r.total:(r.qty||0)*r.price):(r.qty||0)*(x.q?x.c/x.q:0);x.q+=r.qty||0;x.c+=v;op+=v});
b.S.forEach(r=>{if(r.item){const x=bi(r.item);r.self?x.uq+=r.qty||0:x.sq+=r.qty||0}});
const I={},g=c=>I[c]||(I[c]={c,pq:0,pc:0,tr:0,sq:0,sr:0,sn:0,uq:0});let sales=0,purch=0,self=0,trt=0;
s.P.forEach(r=>{if(r.open)return;const v=lt(r),w=tL(s,r);purch+=v;trt+=w;if(r.item){const x=g(r.item);x.pq+=r.qty||0;x.pc+=v;x.tr+=w}});
s.S.forEach(r=>{const v=lt(r);if(r.self){self+=v;if(r.item)g(r.item).uq+=r.qty||0;return}sales+=v;if(r.item){const x=g(r.item);x.sq+=r.qty||0;x.sr+=v;x.sn++}});
const L=Object.values(I);let cogs=0,trs=0,selfc=0,stockv=bun;
L.forEach(x=>{const k=B[x.c]||{q:0,c:0,t:0,sq:0,uq:0},ap=k.q?k.c/k.q:0,at=k.q?k.t/k.q:0;x.hasCost=k.q>0;x.ac=ap+at;x.ap=x.sq?x.sr/x.sq:0;x.cogs=x.sq*ap;x.trs=x.sq*at;x.selfc=x.uq*(ap+at);x.oh=k.q-k.sq-k.uq;x.gm=x.sr-x.cogs-x.trs;x.mp=x.sr&&x.hasCost?x.gm/x.sr*100:null;x.st=x.hasCost?(x.sn?'M':'P'):'S';x.stt=k.q?k.sq/k.q:null;x.sig=x.st!='M'?null:x.stt>1.15?'fast':x.stt<.85?'slow':'ok';cogs+=x.cogs;trs+=x.trs;selfc+=x.selfc});
Object.keys(B).forEach(c=>{const k=B[c];stockv+=k.q?(k.q-k.sq-k.uq)*((k.c+k.t)/k.q):k.c+k.t});
const sal=s.M.reduce((a,t)=>a+t.amt,0),gm=sales-cogs;
return{L,sales,purch,self,selfc,cogs,gm,gp:sales?gm/sales*100:0,tr:trs,trAll:trt,sal,ops:trs+sal,net:gm-trs-sal,np:sales?(gm-trs-sal)/sales*100:0,stockv,open:op}}
function anoms(s){const o=[];[['P',s.P.filter(r=>!r.open)],['S',s.S.filter(r=>!r.self)]].forEach(([k,L])=>{const by={};L.forEach(r=>{if(r.item&&r.price>0)(by[r.item]=by[r.item]||[]).push(r)});for(const c in by){const a=by[c];if(a.length<3)continue;const m=med(a.map(r=>r.price));a.forEach(r=>{const q=r.price/m;if((q>=2||q<=.5)&&!r.an)o.push({k,r,m,q})})}});return o}
const dd=i=>Math.round(Date.parse(i)/864e5),di=n=>new Date(n*864e5).toISOString().slice(0,10);
function prange(p,cal){if(p.mode=='all')return['0000-01-01','9999-12-31'];const a=p.anchor,n=dd(a);if(p.mode=='day')return[a,a];
if(p.mode=='week'){const w=(new Date(n*864e5).getUTCDay()+6)%7;return[di(n-w),di(n-w+6)]}
if(p.mode=='custom')return[p.from||a,p.to||a];
if(cal=='G'){const[y,m]=a.split('-').map(Number);return p.mode=='month'?[di(Date.UTC(y,m-1,1)/864e5),di(Date.UTC(y,m,0)/864e5)]:[y+'-01-01',y+'-12-31']}
const[y,m]=g2e(a),mo=p.mode=='month',nx=mo?(m==13?e2g(y+1,1,1):e2g(y,m+1,1)):e2g(y+1,1,1);return[mo?e2g(y,m,1):e2g(y,1,1),di(dd(nx)-1)]}
function pshift(p,cal,k){if(p.mode=='all')return p;const[a,b]=prange(p,cal);if(p.mode=='custom'){const L=dd(b)-dd(a)+1;return{...p,from:di(dd(a)+k*L),to:di(dd(b)+k*L)}}if(p.mode=='day')return{...p,anchor:di(dd(p.anchor)+k)};if(p.mode=='week')return{...p,anchor:di(dd(p.anchor)+7*k)};return{...p,anchor:di(k<0?dd(a)-1:dd(b)+1)}}
const sub=(s,a,b)=>a<='0000-01-01'?{...s,T:[]}:({...s,P:s.P.filter(r=>r.date>=a&&r.date<=b),S:s.S.filter(r=>r.date>=a&&r.date<=b),M:s.M.filter(m=>m.date>=a&&m.date<=b),T:[]});
const tL=(s,r)=>r.open?(+r.tr||0):r.tr!=null?+r.tr:(r.qty||0)*((s.meta||{})[r.item]?.tpu||0);
function spreadT(s){let al=0,lo=0,n=0;s.T.forEach(t=>{const L=s.P.filter(r=>r.date==t.date);if(!L.length){lo+=t.amt;return}const V=L.reduce((a,r)=>a+lt(r),0);L.forEach(r=>{r.tr=(r.tr||0)+t.amt*(V?lt(r)/V:1/L.length);r.tra=0;n++});al+=t.amt});s.T=[];return{al,lo,n}}
